/var/log/nginx/unikorn.access.log /var/log/nginx/unikorn.error.log /var/log/nginx/course-scheduler.access.log /var/log/nginx/course-scheduler.error.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    create 0640 www-data adm
    postrotate
        if [ -s /run/nginx.pid ]; then
            kill -USR1 "$(cat /run/nginx.pid)"
        fi
    endscript
}
