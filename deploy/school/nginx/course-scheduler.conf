server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name scheduler.unikorn.hkust-gz.edu.cn;
    server_tokens off;

    set_real_ip_from 10.121.10.250;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/course-scheduler.access.log unikorn_no_query;
    error_log /var/log/nginx/course-scheduler.error.log warn;

    proxy_hide_header X-Powered-By;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; media-src 'self' data: blob: https:; frame-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # This file is initially comment-only. After UniKorn SSO acceptance,
    # disable-courseplan-legacy-auth.sh atomically replaces it with a complete
    # /api/auth/ deny rule so no Better Auth endpoint can be reached publicly.
    include /etc/unikorn/scheduler-auth-policy.conf;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $unikorn_external_scheme;
        proxy_set_header X-Forwarded-Port $unikorn_external_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $unikorn_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
