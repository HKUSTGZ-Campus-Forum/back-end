# Install on the former axfff.com production server only after final cutover is
# accepted. Copy old-site-notice.html to the path below, replace the legacy
# application proxy/static locations with this location, and retain the
# existing TLS certificate directives in the HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name unikorn.axfff.com www.unikorn.axfff.com scheduler.unikorn.axfff.com;
    # Keep this snippet independent of the school host's custom log formats,
    # and never record query strings that may contain authorization data.
    access_log off;

    location / {
        root /var/www/unikorn-migration;
        try_files /old-site-notice.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Refresh "10; url=https://unikorn.hkust-gz.edu.cn/" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}

# If TLS terminates directly on the old host, use the same static location in
# each existing HTTPS server block. Remove every legacy proxy/API/static
# location so all browser paths receive the notice, while retaining the
# existing listen and certificate directives unchanged.
