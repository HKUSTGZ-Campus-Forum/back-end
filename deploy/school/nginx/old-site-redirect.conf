# Install on the former axfff.com production server only after final cutover is
# accepted. $request_uri preserves both the original path and query string.
server {
    listen 80;
    listen [::]:80;
    server_name unikorn.axfff.com www.unikorn.axfff.com;
    # Keep this snippet independent of the school host's custom log formats,
    # and never record query strings that may contain authorization data.
    access_log off;
    return 308 https://unikorn.hkust-gz.edu.cn$request_uri;
}

# If TLS terminates directly on the old host, retain its existing certificate
# directives in this server block and use the same return statement.
