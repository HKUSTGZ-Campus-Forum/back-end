server {
    listen 80;
    listen [::]:80;
    server_name unikorn.hkust-gz.edu.cn;
    server_tokens off;
    client_max_body_size 20m;

    set_real_ip_from 10.121.10.250;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/unikorn.access.log unikorn_no_query;
    error_log /var/log/nginx/unikorn.error.log warn;

    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /api {
        return 308 /api/;
    }

    # SISN snapshots are pushed locally from CoursePlan on the same host.
    # Keep the signed ingest endpoint off the public school boundary even
    # though the backend also verifies every request cryptographically.
    location = /api/scheduler/internal/sisn-ingest {
        return 404;
    }

    # The trailing slash on proxy_pass intentionally removes the public /api/
    # prefix because Flask registers routes at /healthz, /auth/*, /posts, etc.
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $unikorn_external_scheme;
        proxy_set_header X-Forwarded-Port $unikorn_external_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $unikorn_external_scheme;
        proxy_set_header X-Forwarded-Port $unikorn_external_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $unikorn_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# Nuxt SSR calls retain the public /api prefix. Keep this listener private so
# SSR can use the same URL contract without a public hairpin through the LB.
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;

    location = /api/scheduler/internal/sisn-ingest {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host unikorn.hkust-gz.edu.cn;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Host unikorn.hkust-gz.edu.cn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }

    location / {
        return 404;
    }
}
