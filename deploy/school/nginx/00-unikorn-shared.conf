# This file is installed in /etc/nginx/conf.d and is evaluated in http{}.
# Never log query strings: OIDC authorization codes and one-time exchange
# tickets are carried in query parameters.
log_format unikorn_no_query '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent"';

map $http_upgrade $unikorn_connection_upgrade {
    default upgrade;
    '' close;
}

# The only currently documented school ingress is 10.121.10.250. Trust its
# scheme header, but ignore a client-supplied X-Forwarded-Proto on direct hits.
map "$realip_remote_addr:$http_x_forwarded_proto" $unikorn_external_scheme {
    default $scheme;
    ~^10\.121\.10\.250:https$ https;
    ~^10\.121\.10\.250:http$ http;
}

map $unikorn_external_scheme $unikorn_external_port {
    default $server_port;
    https 443;
    http 80;
}
