# Include inside the school UniKorn server block, before generic /api/.
# Creator resource paths are served only by the authenticated sandbox gateway.
location ^~ /api/makerspace/worker/ {
    return 404;
}

location ^~ /api/makerspace/run/ {
    client_max_body_size 8m;
    proxy_pass http://127.0.0.1:8001/makerspace/run/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header Upgrade "";
    proxy_read_timeout 25s;
    proxy_send_timeout 25s;
    proxy_cache off;
    access_log off;
    # Declaring headers here prevents inheriting the host's X-Frame-Options
    # DENY and looser Referrer-Policy. The backend supplies the exact CSP.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
}
