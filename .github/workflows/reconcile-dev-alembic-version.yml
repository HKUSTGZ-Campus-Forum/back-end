name: Reconcile Dev Alembic Version

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit first; apply only after reviewing the exact host digest"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      expected_aggregate_sha256:
        description: "Exact aggregate SHA-256 emitted by the reviewed audit (apply only)"
        required: false
        type: string
      confirmation:
        description: "Apply requires REPLACE_DEV_LEGACY_ALEMBIC_HEAD"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: backend-mutations-dev
  cancel-in-progress: false

jobs:
  reconcile:
    name: ${{ inputs.mode }} fixed dev Alembic version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require a fixed dev request
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_AGGREGATE_SHA256: ${{ inputs.expected_aggregate_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          case "$MODE" in
            audit)
              test -z "$EXPECTED_AGGREGATE_SHA256"
              test -z "$CONFIRMATION"
              ;;
            apply)
              [[ "$EXPECTED_AGGREGATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test "$CONFIRMATION" = "REPLACE_DEV_LEGACY_ALEMBIC_HEAD"
              ;;
            *) exit 2 ;;
          esac

      - name: Checkout reviewed helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Encode reviewed helper
        id: helper
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256="$(sha256sum tools/reconcile_dev_alembic_version.py | cut -d ' ' -f 1)"
          gzip -n -9 -c tools/reconcile_dev_alembic_version.py > /tmp/reconcile-dev-alembic-version.py.gz
          payload="$(base64 -w 0 /tmp/reconcile-dev-alembic-version.py.gz)"
          rm -f /tmp/reconcile-dev-alembic-version.py.gz
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"

      - name: Audit or reconcile exact dev Alembic version
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RECONCILE_MODE: ${{ inputs.mode }}
          RECONCILE_EXPECTED_AGGREGATE_SHA256: ${{ inputs.expected_aggregate_sha256 }}
          RECONCILE_CONFIRMATION: ${{ inputs.confirmation }}
          RECONCILE_RUN_ID: ${{ github.run_id }}
          RECONCILE_HELPER_SHA256: ${{ steps.helper.outputs.sha256 }}
          RECONCILE_HELPER_GZIP_B64: ${{ steps.helper.outputs.payload }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          command_timeout: 10m
          envs: RECONCILE_MODE,RECONCILE_EXPECTED_AGGREGATE_SHA256,RECONCILE_CONFIRMATION,RECONCILE_RUN_ID,RECONCILE_HELPER_SHA256,RECONCILE_HELPER_GZIP_B64
          script: |
            set -Eeuo pipefail
            umask 027
            helper="$(mktemp)"
            trap 'rm -f "$helper"' EXIT
            printf '%s' "$RECONCILE_HELPER_GZIP_B64" | base64 --decode | gzip -d > "$helper"
            test "$(sha256sum "$helper" | cut -d ' ' -f 1)" = "$RECONCILE_HELPER_SHA256"
            chmod 0500 "$helper"
            exec 9>/data/dev_unikorn/backend-mutations-dev.lock
            flock -n 9
            if [ "$RECONCILE_MODE" = "audit" ]; then
              python3 -I "$helper" --mode audit
            else
              cd /data/dev_unikorn/back-end
              backup_file="/data/dev_unikorn/backups/dev-alembic-version-${RECONCILE_RUN_ID}.dump"
              source venv/bin/activate
              python -m app.scripts.create_verified_database_backup \
                --output "$backup_file" \
                --expected-database dev_unikorn
              backup_sha256="$(sha256sum "$backup_file" | cut -d ' ' -f 1)"
              python3 -I "$helper" \
                --mode apply \
                --expected-aggregate-sha256 "$RECONCILE_EXPECTED_AGGREGATE_SHA256" \
                --confirmation "$RECONCILE_CONFIRMATION" \
                --backup-sha256 "$backup_sha256"
            fi
