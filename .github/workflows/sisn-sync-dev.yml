name: Sync SISN offerings to dev

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Synchronization mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: backend-mutations-dev
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch, validate, and synchronize
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Synchronize through the school-server proxy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          SISN_PROXY_BASE_URL: https://scheduler.unikorn.axfff.com
          SISN_PROXY_SHARED_SECRET: ${{ secrets.SISN_PROXY_SHARED_SECRET }}
          SISN_SYNC_MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: SISN_PROXY_BASE_URL,SISN_PROXY_SHARED_SECRET,SISN_SYNC_MODE
          command_timeout: 12m
          script: |
            set -Eeuo pipefail
            readonly app_dir="/data/dev_unikorn/back-end"
            readonly archive_dir="/data/dev_unikorn/sisn-archive"
            readonly lock_path="/data/dev_unikorn/backend-mutations-dev.lock"

            test -n "${SISN_PROXY_SHARED_SECRET:-}"
            test "${SISN_SYNC_MODE}" = "dry-run" -o "${SISN_SYNC_MODE}" = "apply"
            cd "$app_dir"
            test -f app/data/pending/scheduler_offerings/26-27fall.json
            install -d -m 0700 "$archive_dir"
            umask 077
            exec 9>"$lock_path"
            flock -w 60 9
            source venv/bin/activate

            sync_args=(
              --term 2610
              --baseline app/data/pending/scheduler_offerings/26-27fall.json
              --archive-dir "$archive_dir"
            )
            if [[ "$SISN_SYNC_MODE" = "apply" ]]; then
              sync_args+=(--apply)
            fi
            python -m app.scripts.sync_sisn_offerings "${sync_args[@]}"
