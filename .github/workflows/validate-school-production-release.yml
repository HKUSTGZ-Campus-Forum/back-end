name: Validate school production release

on:
  push:
    branches:
      - school-production

permissions:
  contents: read
  statuses: write

concurrency:
  group: school-production-validation
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
      statuses: write
    uses: HKUSTGZ-Campus-Forum/back-end/.github/workflows/validate-school-production-candidate.yml@main
    with:
      control_sha: ${{ github.sha }}
