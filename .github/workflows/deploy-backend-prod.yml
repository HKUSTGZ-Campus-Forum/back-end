name: Deploy Backend to Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-mutations-production
  cancel-in-progress: false

jobs:
  test:
    name: Test production candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - name: Require the production branch
      run: |
        if [[ "${GITHUB_REF}" != "refs/heads/production" ]]; then
          echo "This workflow only deploys refs/heads/production; got ${GITHUB_REF}." >&2
          exit 1
        fi

    - name: Checkout the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies and run backend tests
      run: |
        set -euo pipefail
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt
        python -m pip check
        python - <<'PY'
        from alibabacloud_green20220302.client import Client  # noqa: F401
        from alibabacloud_tea_openapi import models  # noqa: F401
        PY
        python -m pytest tests/ -q

    - name: Validate scheduler popularity cron tooling
      run: |
        set -euo pipefail
        python -m py_compile \
          scripts/run_scheduler_popularity_cron.py \
          scripts/sample_scheduler_popularity.py \
          tools/render_scheduler_popularity_crontab.py

  deploy:
    name: Deploy the verified candidate
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production

    steps:
    - name: Checkout the production verifier
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Encode production transaction verifier
      id: verifier
      shell: bash
      run: |
        set -Eeuo pipefail
        sha256="$(sha256sum tools/reconcile_dev_migration_checkout.py | cut -d ' ' -f 1)"
        gzip -n -9 -c tools/reconcile_dev_migration_checkout.py > /tmp/production-transaction-verifier.py.gz
        payload="$(base64 -w 0 /tmp/production-transaction-verifier.py.gz)"
        rm -f /tmp/production-transaction-verifier.py.gz
        printf 'sha256=%s\n' "${sha256}" >> "${GITHUB_OUTPUT}"
        printf 'payload=%s\n' "${payload}" >> "${GITHUB_OUTPUT}"

    - name: Encode production API deployment journal
      id: deploy-journal
      shell: bash
      run: |
        set -Eeuo pipefail
        sha256="$(sha256sum tools/production_deploy_journal.py | cut -d ' ' -f 1)"
        gzip -n -9 -c tools/production_deploy_journal.py > /tmp/production-deploy-journal.py.gz
        payload="$(base64 -w 0 /tmp/production-deploy-journal.py.gz)"
        rm -f /tmp/production-deploy-journal.py.gz
        printf 'sha256=%s\n' "${sha256}" >> "${GITHUB_OUTPUT}"
        printf 'payload=%s\n' "${payload}" >> "${GITHUB_OUTPUT}"

    - name: Deploy exact commit via SSH
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      env:
        DEPLOY_SHA: ${{ github.sha }}
        CONFIGURED_PROD_API_URL: ${{ vars.PROD_SCHEDULER_HEALTH_URL }}
        PROD_RECONCILE_HELPER_GZIP_B64: ${{ steps.verifier.outputs.payload }}
        PROD_RECONCILE_HELPER_SHA256: ${{ steps.verifier.outputs.sha256 }}
        PROD_DEPLOY_JOURNAL_GZIP_B64: ${{ steps.deploy-journal.outputs.payload }}
        PROD_DEPLOY_JOURNAL_SHA256: ${{ steps.deploy-journal.outputs.sha256 }}
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}
        fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT }}
        envs: DEPLOY_SHA,CONFIGURED_PROD_API_URL,PROD_RECONCILE_HELPER_GZIP_B64,PROD_RECONCILE_HELPER_SHA256,PROD_DEPLOY_JOURNAL_GZIP_B64,PROD_DEPLOY_JOURNAL_SHA256
        command_timeout: 35m
        script: |
          set -Eeuo pipefail

          readonly app_dir="/data/prod_unikorn/back-end"
          readonly backup_dir="/data/prod_unikorn/backups"
          readonly minimum_free_reserve_bytes=1073741824
          readonly sampler_root="/data/prod_unikorn/scheduler-popularity-releases"
          readonly sampler_candidate="${sampler_root}/${DEPLOY_SHA}.v2"
          readonly sampler_env_file="${app_dir}/.env"
          readonly sampler_lock_file="${app_dir}/.git/unikorn-operations/backend-mutations.lock"
          readonly service_name="prod-unikorn-api.service"
          readonly local_api_url="http://127.0.0.1:8001/scheduler/semesters"
          readonly public_api_url="${CONFIGURED_PROD_API_URL:-https://unikorn.axfff.com/api/scheduler/semesters}"
          # Fixed UTC epochs for 2026-09-30 23:55 and 23:59 Asia/Shanghai.
          # Keeping these as literals makes date parsing fail-closed and the
          # corresponding test derives them independently with zoneinfo.
          readonly sample_end_epoch=1790783700
          readonly terminal_cutoff_epoch=1790783940
          if (( sample_end_epoch <= 0 || terminal_cutoff_epoch <= sample_end_epoch )); then
            echo "Invalid scheduler popularity sampling boundary." >&2
            exit 1
          fi
          # The protected window begins 45 minutes before cutoff, exceeding the
          # SSH action's 35-minute hard timeout by ten minutes.
          readonly protected_start_epoch="$((terminal_cutoff_epoch - 45 * 60))"
          readonly protected_end_epoch="$((terminal_cutoff_epoch + 130))"

          deployment_succeeded=false
          crontab_existed=false
          crontab_mutated=false
          crontab_stage=""
          crontab_before=""
          crontab_candidate=""
          crontab_readback=""
          original_crontab_sha=""
          installed_crontab_sha=""
          sampler_block=""
          sampler_release_stage=""
          sampler_verify_stage=""
          candidate_stage=""
          verifier=""
          deploy_journal=""
          api_response=""
          public_api_response=""
          api_transaction_prepared=false
          api_forward_only=false
          api_transaction_committed=false
          api_recovery_mode=false
          skip_sampler_activation=false
          api_old_sha=""
          journal_phase=""

          journal_field() {
            field_name="$1"
            "${app_dir}/venv/bin/python" -c \
              'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' \
              "${field_name}"
          }

          journal_advance() {
            next_phase="$1"
            shift
            "${app_dir}/venv/bin/python" -I "${deploy_journal}" \
              advance --target-sha "${DEPLOY_SHA}" --phase "${next_phase}" "$@" >/dev/null
          }

          sync_api_transaction_state() {
            [[ "${api_transaction_prepared}" == "true" ]] || return 0
            journal_state="$("${app_dir}/venv/bin/python" -I "${deploy_journal}" \
              show --target-sha "${DEPLOY_SHA}")" || {
                # A corrupt or unavailable journal must never cause an automatic
                # rollback after a migration may have begun.
                api_forward_only=true
                return 1
              }
            journal_phase="$(printf '%s' "${journal_state}" | journal_field phase)"
            api_old_sha="$(printf '%s' "${journal_state}" | journal_field old_sha)"
            case "${journal_phase}" in
              MIGRATION_STARTED|DB_AT_TARGET|CANDIDATE_START_REQUESTED|CANDIDATE_STARTED|HEALTHY|COMMITTED)
                api_forward_only=true
                ;;
              *)
                api_forward_only=false
                ;;
            esac
            if [[ "${journal_phase}" == "COMMITTED" ]]; then
              api_transaction_committed=true
            fi
          }

          assert_api_checkout_for_phase() {
            current_sha="$(git rev-parse HEAD)"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            case "${journal_phase}" in
              PREPARED|SERVICE_STOP_REQUESTED|SERVICE_STOPPED|FINAL_BACKUP_STARTED|FINAL_BACKUP_VERIFIED)
                test "${current_sha}" = "${api_old_sha}"
                ;;
              CHECKOUT_ACTIVATION_REQUESTED)
                if [[ "${current_sha}" != "${api_old_sha}" && "${current_sha}" != "${DEPLOY_SHA}" ]]; then
                  echo "Checkout ${current_sha} is inconsistent with recovery phase ${journal_phase}." >&2
                  return 1
                fi
                ;;
              CANDIDATE_CHECKED_OUT|MIGRATION_STARTED|DB_AT_TARGET|CANDIDATE_START_REQUESTED|CANDIDATE_STARTED|HEALTHY|COMMITTED)
                test "${current_sha}" = "${DEPLOY_SHA}"
                ;;
              *)
                echo "Unexpected API deployment journal phase: ${journal_phase}" >&2
                return 1
                ;;
            esac
          }

          database_identity() {
            AUTO_INIT_ON_STARTUP=false ENABLE_BACKGROUND_TASKS=false \
              "${app_dir}/venv/bin/python" - <<'PY'
          import json
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          from app.config import Config

          url = make_url(Config.SQLALCHEMY_DATABASE_URI)
          if url.get_backend_name() != "postgresql" or url.database != "prod_unikorn":
              raise SystemExit("production database configuration mismatch")
          engine = create_engine(
              Config.SQLALCHEMY_DATABASE_URI,
              **Config.SQLALCHEMY_ENGINE_OPTIONS,
          )
          with engine.connect() as connection:
              database_name = connection.execute(
                  text("SELECT current_database()")
              ).scalar_one()
              if database_name != "prod_unikorn":
                  raise SystemExit("connected database mismatch")
              system_identifier = str(
                  connection.execute(
                      text("SELECT system_identifier FROM pg_control_system()")
                  ).scalar_one()
              )
              database_size = connection.execute(
                  text("SELECT pg_database_size(current_database())")
              ).scalar_one()
          if not system_identifier.isdecimal():
              raise SystemExit("PostgreSQL system identifier is invalid")
          print(json.dumps({
              "database_name": database_name,
              "database_size": database_size,
              "database_system_identifier": system_identifier,
          }, sort_keys=True))
          PY
          }

          assert_recorded_database_identity() {
            identity_json="$(database_identity)"
            actual_database_name="$(printf '%s' "${identity_json}" | journal_field database_name)"
            actual_system_identifier="$(printf '%s' "${identity_json}" | journal_field database_system_identifier)"
            recorded_database_name="$(printf '%s' "${journal_state}" | journal_field database_name)"
            recorded_system_identifier="$(printf '%s' "${journal_state}" | journal_field database_system_identifier)"
            if [[ "${actual_database_name}" != "${recorded_database_name}" || \
                  "${actual_system_identifier}" != "${recorded_system_identifier}" ]]; then
              echo "Production database identity differs from the recovery journal." >&2
              return 1
            fi
          }

          assert_api_service_checkout() {
            if ! api_main_pid="$(/usr/bin/systemctl show -p MainPID --value "${service_name}")" || \
                ! api_working_directory="$(/usr/bin/systemctl show -p WorkingDirectory --value "${service_name}")" || \
                ! api_root_directory="$(/usr/bin/systemctl show -p RootDirectory --value "${service_name}")" || \
                ! api_root_image="$(/usr/bin/systemctl show -p RootImage --value "${service_name}")"; then
              echo "Unable to verify the production API service launch context." >&2
              return 1
            fi
            if [[ ! "${api_main_pid}" =~ ^[1-9][0-9]*$ || \
                  "${api_working_directory}" != "${app_dir}" || \
                  -n "${api_root_directory}" || -n "${api_root_image}" ]]; then
              echo "Production API service is not running from the exact fixed checkout." >&2
              return 1
            fi
          }

          restore_api_before_forward_boundary() {
            [[ "${api_transaction_prepared}" == "true" ]] || return 0
            [[ "${api_forward_only}" == "false" ]] || return 0
            [[ "${api_transaction_committed}" == "false" ]] || return 0
            echo "Restoring the pre-deployment API checkout before the database boundary." >&2
            cd "${app_dir}" || return 1
            git checkout --detach "${api_old_sha}" || return 1
            test "$(git rev-parse HEAD)" = "${api_old_sha}" || return 1
            test -z "$(git status --porcelain=v1 --untracked-files=all)" || return 1
            if [[ "${journal_phase}" == "SERVICE_STOP_REQUESTED" || \
                  "${journal_phase}" == "SERVICE_STOPPED" || \
                  "${journal_phase}" == "FINAL_BACKUP_STARTED" || \
                  "${journal_phase}" == "FINAL_BACKUP_VERIFIED" || \
                  "${journal_phase}" == "CHECKOUT_ACTIVATION_REQUESTED" ]] || \
                ! /usr/bin/systemctl is-active --quiet "${service_name}"; then
              sudo -n /usr/bin/systemctl restart "${service_name}" || return 1
            fi
            /usr/bin/systemctl is-active --quiet "${service_name}" || return 1
            assert_api_service_checkout || return 1
            rollback_health="$(mktemp)"
            rollback_ready=false
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
                  --output "${rollback_health}" "${local_api_url}"; then
                rollback_ready=true
                break
              fi
              sleep 3
            done
            if [[ "${rollback_ready}" != "true" ]]; then
              rm -f -- "${rollback_health}"
              return 1
            fi
            "${app_dir}/venv/bin/python" - "${rollback_health}" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as response_file:
              payload = json.load(response_file)
          if not isinstance(payload, list) or not payload:
              raise SystemExit("restored local scheduler health is invalid")
          PY
            rm -f -- "${rollback_health}"
            "${app_dir}/venv/bin/python" -I "${deploy_journal}" \
              archive-aborted --target-sha "${DEPLOY_SHA}" >/dev/null || return 1
            api_transaction_prepared=false
          }

          read_systemd_unit_state() {
            local unit_name="$1"
            local properties property_line
            local seen_load_state=false
            local seen_active_state=false
            local seen_unit_file_state=false

            systemd_load_state=""
            systemd_active_state=""
            systemd_unit_file_state=""
            if ! properties="$(/usr/bin/systemctl show --all \
                -p LoadState -p ActiveState -p UnitFileState -- "${unit_name}")"; then
              return 1
            fi
            while IFS= read -r property_line || [[ -n "${property_line}" ]]; do
              case "${property_line}" in
                LoadState=*)
                  [[ "${seen_load_state}" == "false" ]] || return 1
                  systemd_load_state="${property_line#LoadState=}"
                  seen_load_state=true
                  ;;
                ActiveState=*)
                  [[ "${seen_active_state}" == "false" ]] || return 1
                  systemd_active_state="${property_line#ActiveState=}"
                  seen_active_state=true
                  ;;
                UnitFileState=*)
                  [[ "${seen_unit_file_state}" == "false" ]] || return 1
                  systemd_unit_file_state="${property_line#UnitFileState=}"
                  seen_unit_file_state=true
                  ;;
                *)
                  return 1
                  ;;
              esac
            done <<< "${properties}"
            [[ "${seen_load_state}" == "true" && \
               "${seen_active_state}" == "true" && \
               "${seen_unit_file_state}" == "true" ]]
          }

          assert_unit_inactive() {
            unit_name="$1"
            if ! read_systemd_unit_state "${unit_name}"; then
              echo "Unable to verify that ${unit_name} quiesced." >&2
              return 1
            fi
            if [[ "${systemd_load_state}" != "loaded" || \
                  ( "${systemd_active_state}" != "inactive" && \
                    "${systemd_active_state}" != "failed" ) ]]; then
              echo "${unit_name} did not quiesce (load=${systemd_load_state}, active=${systemd_active_state}, unit-file=${systemd_unit_file_state})." >&2
              return 1
            fi
          }

          require_sudo_permission() {
            if ! sudo -n -l -- "$@" >/dev/null; then
              echo "Missing non-interactive sudo permission for: $*" >&2
              return 1
            fi
          }

          assert_legacy_sampler_units_absent() {
            # Production was audited with no legacy sampler units installed.
            # Refuse coexistence instead of silently double-sampling or asking
            # for new sampler sudo authority during this user-cron rollout.
            for legacy_sampler_unit in \
              unikorn-scheduler-popularity-baseline.service \
              unikorn-scheduler-popularity-sample.service \
              unikorn-scheduler-popularity-final.service \
              unikorn-scheduler-popularity-verify.service \
              unikorn-scheduler-popularity-sample.timer \
              unikorn-scheduler-popularity-final.timer; do
              if ! read_systemd_unit_state "${legacy_sampler_unit}"; then
                echo "Unable to verify legacy sampler unit ${legacy_sampler_unit}." >&2
                return 1
              fi
              if [[ "${systemd_load_state}" != "not-found" || \
                    "${systemd_active_state}" != "inactive" || \
                    -n "${systemd_unit_file_state}" ]]; then
                echo "Refusing user-cron activation while legacy sampler unit ${legacy_sampler_unit} exists (load=${systemd_load_state}, active=${systemd_active_state}, unit-file=${systemd_unit_file_state})." >&2
                return 1
              fi
            done
          }

          extract_sampler_release() {
            local destination="$1"
            # The sampler imports the application package, but it must not
            # inherit unrelated tracked development artifacts (including
            # repository-local virtualenv symlinks) from a whole-tree archive.
            git archive "${DEPLOY_SHA}" -- \
              app \
              scripts/run_scheduler_popularity_cron.py \
              scripts/sample_scheduler_popularity.py \
              tools/render_scheduler_popularity_crontab.py | tar -x -C "${destination}"
          }

          restore_sampling_crontab() {
            [[ "${crontab_mutated}" == "true" ]] || return 0
            echo "Restoring the exact pre-deployment user crontab." >&2
            if [[ -z "${original_crontab_sha}" || -z "${installed_crontab_sha}" ]]; then
              echo "Refusing rollback because crontab identity metadata is incomplete." >&2
              return 1
            fi
            rollback_current_existed=false
            if crontab -l > "${crontab_stage}/rollback-current" \
                2>"${crontab_stage}/rollback-current-error"; then
              rollback_current_existed=true
            else
              rollback_read_status=$?
              if [[ "${rollback_read_status}" -eq 1 ]] && \
                  grep -Fq 'no crontab for' "${crontab_stage}/rollback-current-error"; then
                : > "${crontab_stage}/rollback-current"
              else
                echo "Refusing rollback because the current user crontab is unreadable." >&2
                return 1
              fi
            fi
            rollback_current_sha="$(sha256sum "${crontab_stage}/rollback-current" | cut -d ' ' -f1)"
            if [[ "${rollback_current_existed}" == "${crontab_existed}" && \
                  "${rollback_current_sha}" == "${original_crontab_sha}" ]]; then
              echo "Candidate crontab was not installed; the original remains byte-identical." >&2
              crontab_mutated=false
              return 0
            fi
            if [[ "${rollback_current_existed}" != "true" || \
                  "${rollback_current_sha}" != "${installed_crontab_sha}" ]]; then
              echo "Refusing rollback because the user crontab changed after candidate activation." >&2
              return 1
            fi
            if [[ "${crontab_existed}" == "true" ]]; then
              crontab "${crontab_before}" || return 1
              crontab -l > "${crontab_stage}/rollback-read" || return 1
              cmp -s "${crontab_before}" "${crontab_stage}/rollback-read" || return 1
            else
              crontab -r >/dev/null 2>&1 || return 1
              set +e
              crontab -l > "${crontab_stage}/rollback-read" \
                2>"${crontab_stage}/rollback-error"
              rollback_read_status=$?
              set -e
              if [[ "${rollback_read_status}" -ne 1 ]]; then
                return 1
              fi
              grep -Fq 'no crontab for' "${crontab_stage}/rollback-error" || return 1
            fi
            crontab_mutated=false
          }

          activate_sampling_crontab() {
            # This is the final pre-mutation gate. A failure here leaves the
            # already-committed API in place and the original crontab untouched,
            # so the same deployment SHA can safely retry sampler activation.
            assert_legacy_sampler_units_absent
            crontab_mutated=true
            crontab "${crontab_candidate}"
            crontab -l > "${crontab_readback}"
            test "$(sha256sum "${crontab_readback}" | cut -d ' ' -f1)" = "${expected_crontab_sha}"
            # A second read closes the most obvious concurrent-edit window.
            sleep 1
            crontab -l > "${crontab_readback}.second"
            cmp -s "${crontab_readback}" "${crontab_readback}.second"
            "${sampler_args[@]}" --mode status >/dev/null
            crontab_mutated=false
          }

          cleanup_deployment() {
            deploy_status=$?
            cleanup_failed=false
            trap - EXIT
            trap '' HUP INT TERM
            set +e
            if [[ "${deploy_status}" -ne 0 && "${deployment_succeeded}" != "true" ]]; then
              if ! sync_api_transaction_state; then
                cleanup_failed=true
                echo "CRITICAL: API deployment journal could not be read safely." >&2
              fi
              if [[ "${api_forward_only}" == "true" && "${api_transaction_committed}" == "false" ]]; then
                echo "CRITICAL: API deployment crossed MIGRATION_STARTED; the recorded candidate must be resumed forward." >&2
              elif ! restore_api_before_forward_boundary; then
                cleanup_failed=true
                echo "CRITICAL: pre-migration API checkout could not be restored." >&2
              fi
              if ! restore_sampling_crontab; then
                cleanup_failed=true
                echo "CRITICAL: the pre-deployment user crontab could not be restored." >&2
              fi
            fi
            [[ -z "${api_response}" ]] || rm -f -- "${api_response}"
            [[ -z "${public_api_response}" ]] || rm -f -- "${public_api_response}"
            [[ -z "${crontab_stage}" ]] || rm -rf -- "${crontab_stage}"
            [[ -z "${sampler_release_stage}" ]] || rm -rf -- "${sampler_release_stage}"
            [[ -z "${sampler_verify_stage}" ]] || rm -rf -- "${sampler_verify_stage}"
            [[ -z "${candidate_stage}" ]] || rm -rf -- "${candidate_stage}"
            [[ -z "${verifier}" ]] || rm -f -- "${verifier}"
            [[ -z "${deploy_journal}" ]] || rm -f -- "${deploy_journal}"
            [[ "${cleanup_failed}" == "false" ]] || echo "CRITICAL: production deployment cleanup was incomplete." >&2
            exit "${deploy_status}"
          }

          exit_for_signal() {
            signal_number="$1"
            signal_name="$2"
            trap '' HUP INT TERM
            echo "Received ${signal_name}; running deployment cleanup." >&2
            exit "$((128 + signal_number))"
          }

          trap cleanup_deployment EXIT
          trap 'exit_for_signal 1 HUP' HUP
          trap 'exit_for_signal 2 INT' INT
          trap 'exit_for_signal 15 TERM' TERM

          echo "Starting production deployment for ${DEPLOY_SHA}..."
          cd "${app_dir}"
          readonly production_git_dir="${app_dir}/.git"
          readonly production_ops_dir="${production_git_dir}/unikorn-operations"
          readonly production_lock_path="${production_ops_dir}/backend-mutations.lock"
          if [[ "$(git rev-parse --absolute-git-dir)" != "${production_git_dir}" || \
                "$(git rev-parse --path-format=absolute --git-common-dir)" != "${production_git_dir}" || \
                -L "${production_git_dir}" || ! -d "${production_git_dir}" ]]; then
            echo "Production Git directory is not the fixed real directory." >&2
            exit 1
          fi
          IFS=: read -r git_owner git_group git_mode < <(
            stat -c '%u:%g:%a' "${production_git_dir}"
          )
          effective_uid="$(id -u)"
          effective_gid="$(id -g)"
          if [[ "${git_owner}" != "${effective_uid}" || $((8#${git_mode} & 022)) -ne 0 ]]; then
            printf \
              'Production Git directory has unsafe metadata: %s (owner_uid=%s, effective_uid=%s, group_gid=%s, effective_gid=%s, mode=%04o, required_owner_uid=%s, forbidden_write_bits=0022).\n' \
              "${production_git_dir}" "${git_owner}" "${effective_uid}" \
              "${git_group}" "${effective_gid}" "$((8#${git_mode}))" \
              "${effective_uid}" >&2
            exit 1
          fi
          umask 077
          if [[ ! -e "${production_ops_dir}" ]]; then
            mkdir -- "${production_ops_dir}"
          fi
          if [[ -L "${production_ops_dir}" || ! -d "${production_ops_dir}" || \
                "$(stat -c '%u:%a' "${production_ops_dir}")" != "$(id -u):700" || \
                "$(stat -c '%d' "${production_ops_dir}")" != "$(stat -c '%d' "${production_git_dir}")" || \
                "$(stat -c '%d' "${production_ops_dir}")" != "$(stat -c '%d' "${app_dir}/migrations/versions")" ]]; then
            echo "Production Git ops root has unsafe metadata." >&2
            exit 1
          fi
          # Read/write opening avoids truncating an existing path before its
          # descriptor identity and metadata are validated below.
          exec 9<>"${production_lock_path}"
          umask 022
          lock_fd_metadata="$(stat -Lc '%d:%i:%u:%g:%a:%h:%s' "/proc/$$/fd/9")"
          lock_path_metadata="$(stat -Lc '%d:%i:%u:%g:%a:%h:%s' "${production_lock_path}")"
          expected_lock_safety="$(id -u):600:1:0"
          lock_safety="$(stat -Lc '%u:%a:%h:%s' "/proc/$$/fd/9")"
          if [[ -L "${production_lock_path}" || ! -e "/proc/$$/fd/9" || \
                "${lock_fd_metadata}" != "${lock_path_metadata}" || \
                "${lock_safety}" != "${expected_lock_safety}" ]]; then
            echo "Production mutation lock has unsafe metadata or identity." >&2
            exit 1
          fi
          flock -n 9
          deploy_journal="$(mktemp)"
          printf '%s' "${PROD_DEPLOY_JOURNAL_GZIP_B64}" | base64 --decode | gzip -d > "${deploy_journal}"
          test "$(sha256sum "${deploy_journal}" | cut -d ' ' -f 1)" = "${PROD_DEPLOY_JOURNAL_SHA256}"
          chmod 0500 "${deploy_journal}"

          # An interrupted transaction is the first production concern.  It is
          # authenticated and resumed before mutable remote refs, protected
          # sampling windows, sampler permissions, or ordinary dirty-tree gates.
          journal_inspection="$("${app_dir}/venv/bin/python" -I "${deploy_journal}" inspect)"
          journal_status="$(printf '%s' "${journal_inspection}" | journal_field status)"
          if [[ "${journal_status}" == "active" ]]; then
            journal_state="$(printf '%s' "${journal_inspection}" | \
              "${app_dir}/venv/bin/python" -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["journal"], sort_keys=True))')"
            journal_phase="$(printf '%s' "${journal_state}" | journal_field phase)"
            journal_target_sha="$(printf '%s' "${journal_state}" | journal_field target_sha)"
            if [[ "${journal_phase}" != "COMMITTED" ]]; then
              if [[ "${journal_target_sha}" != "${DEPLOY_SHA}" ]]; then
                echo "Incomplete API deployment must be recovered at target ${journal_target_sha}; refusing ${DEPLOY_SHA}." >&2
                exit 1
              fi
              api_recovery_mode=true
              api_transaction_prepared=true
              api_old_sha="$(printf '%s' "${journal_state}" | journal_field old_sha)"
              git cat-file -e "${DEPLOY_SHA}^{commit}"
              sync_api_transaction_state
              assert_api_checkout_for_phase
            fi
          elif [[ "${journal_status}" != "absent" ]]; then
            echo "Production API journal inspection returned an unexpected status." >&2
            exit 1
          fi

          # Reconciliation evidence is an ordinary new-deploy preflight.  An
          # incomplete API transaction must recover even if unrelated retained
          # quarantine evidence has since become unreadable.
          if [[ "${api_recovery_mode}" != "true" ]]; then
            command -v crontab >/dev/null
            # This first check is deliberately before backup, checkout, and
            # migration. A fresh deployment must not advance the API/database
            # while an old timer could still sample concurrently.
            assert_legacy_sampler_units_absent
            verifier="$(mktemp)"
            printf '%s' "${PROD_RECONCILE_HELPER_GZIP_B64}" | base64 --decode | gzip -d > "${verifier}"
            test "$(sha256sum "${verifier}" | cut -d ' ' -f 1)" = "${PROD_RECONCILE_HELPER_SHA256}"
            chmod 0500 "${verifier}"
            export UNIKORN_BACKEND_MUTATION_LOCK_FD=9
            export UNIKORN_BACKEND_MUTATION_LOCK_DEV_INO="$(stat -Lc '%d:%i' "/proc/$$/fd/9")"
            python3 -I "${verifier}" --target production --mode verify-transactions
            rm -f -- "${verifier}"
            verifier=""
            unset UNIKORN_BACKEND_MUTATION_LOCK_FD UNIKORN_BACKEND_MUTATION_LOCK_DEV_INO
          fi

          deploy_epoch="$(date +%s)"
          if (( deploy_epoch >= protected_start_epoch && deploy_epoch <= protected_end_epoch )); then
            if [[ "${api_recovery_mode}" == "true" ]]; then
              skip_sampler_activation=true
              echo "Protected terminal window: recovering the incomplete API transaction only; sampler activation will be skipped."
            else
              echo "Refusing a new deployment during the protected terminal-sampling window." >&2
              exit 1
            fi
          fi

          require_sudo_permission /usr/bin/systemctl stop "${service_name}"
          require_sudo_permission /usr/bin/systemctl start "${service_name}"
          require_sudo_permission /usr/bin/systemctl restart "${service_name}"

          live_checkout_sha="$(git rev-parse HEAD)"
          if [[ "${api_recovery_mode}" != "true" ]]; then
            dirty_state="$(git status --porcelain=v1 --untracked-files=all)"
            if [[ -n "${dirty_state}" ]]; then
              echo "Refusing to deploy over a dirty production checkout:" >&2
              printf '%s\n' "${dirty_state}" >&2
              echo "Run the reviewed production migration reconciliation workflow before retrying deployment." >&2
              exit 1
            fi

            git fetch --prune origin \
              "+refs/heads/production:refs/remotes/origin/production"
            remote_sha="$(git rev-parse refs/remotes/origin/production)"
            if [[ "${remote_sha}" != "${DEPLOY_SHA}" ]]; then
              echo "Fetched production SHA ${remote_sha}, expected ${DEPLOY_SHA}." >&2
              exit 1
            fi

            journal_state="$("${app_dir}/venv/bin/python" -I "${deploy_journal}" \
              prepare --target-sha "${DEPLOY_SHA}" --old-sha "${live_checkout_sha}")"
            api_transaction_prepared=true
            journal_phase="$(printf '%s' "${journal_state}" | journal_field phase)"
            api_old_sha="$(printf '%s' "${journal_state}" | journal_field old_sha)"
            sync_api_transaction_state
          fi
          assert_api_checkout_for_phase

          if [[ "${api_recovery_mode}" != "true" ]] && \
              ! git merge-base --is-ancestor "${api_old_sha}" "${DEPLOY_SHA}"; then
            echo "Production candidate is not a descendant of the journaled live checkout." >&2
            exit 1
          fi
          for dependency_manifest in requirements.txt requirements.lock; do
            live_manifest="$(git rev-parse "${api_old_sha}:${dependency_manifest}")"
            candidate_manifest="$(git rev-parse "${DEPLOY_SHA}:${dependency_manifest}")"
            if [[ "${live_manifest}" != "${candidate_manifest}" ]]; then
              echo "${dependency_manifest} changed; refusing to mutate the shared production venv." >&2
              exit 1
            fi
          done
          "${app_dir}/venv/bin/python" -m pip check
          "${app_dir}/venv/bin/python" - <<'PY'
          from alibabacloud_green20220302.client import Client  # noqa: F401
          from alibabacloud_tea_openapi import models  # noqa: F401
          PY
          echo "Existing production dependencies match the candidate and are healthy."

          candidate_stage="$(mktemp -d /tmp/unikorn-api-candidate.XXXXXX)"
          git archive "${DEPLOY_SHA}" | tar -x -C "${candidate_stage}"
          ln -s "${app_dir}/venv" "${candidate_stage}/venv"
          ln -s "${app_dir}/.env" "${candidate_stage}/.env"
          candidate_heads="$(
            cd "${candidate_stage}"
            AUTO_INIT_ON_STARTUP=false ENABLE_BACKGROUND_TASKS=false \
              "${app_dir}/venv/bin/python" -m flask db heads 2>/dev/null |
              awk '{print $1}' | sort -u
          )"
          expected_candidate_heads=$'20260813_feedback_schema\n20260813_pop_history_truth'
          if [[ "${candidate_heads}" != "${expected_candidate_heads}" ]]; then
            echo "Candidate Alembic heads are unexpected:" >&2
            printf '%s\n' "${candidate_heads}" >&2
            exit 1
          fi
          if [[ -L "${backup_dir}" || ! -d "${backup_dir}" || \
                "$(stat -c '%u:%g:%a' "${backup_dir}")" != "$(id -u):$(id -g):750" ]]; then
            echo "Production backup directory has unsafe metadata." >&2
            exit 1
          fi
          if [[ "${journal_phase}" == "PREPARED" ]]; then
            identity_json="$(database_identity)"
            database_size="$(printf '%s' "${identity_json}" | journal_field database_size)"
            "${app_dir}/venv/bin/python" -I \
              "${candidate_stage}/tools/check_backup_capacity.py" \
              --path "${backup_dir}" --payload-bytes "${database_size}" \
              --reserve-bytes "${minimum_free_reserve_bytes}" \
              --purpose "a full backup plus the 1 GiB safety reserve"
            journal_advance SERVICE_STOP_REQUESTED
            journal_phase="SERVICE_STOP_REQUESTED"
          fi

          if [[ "${journal_phase}" == "SERVICE_STOP_REQUESTED" ]]; then
            sudo -n /usr/bin/systemctl stop "${service_name}"
            assert_unit_inactive "${service_name}"
            journal_advance SERVICE_STOPPED
            journal_phase="SERVICE_STOPPED"
          fi
          if [[ "${journal_phase}" == "SERVICE_STOPPED" ]]; then
            timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            short_sha="$(printf '%.12s' "${DEPLOY_SHA}")"
            planned_backup_name="prod_unikorn-${timestamp}-${short_sha}.dump"
            journal_advance FINAL_BACKUP_STARTED \
              --backup-name "${planned_backup_name}"
            journal_phase="FINAL_BACKUP_STARTED"
            journal_state="$("${app_dir}/venv/bin/python" -I "${deploy_journal}" \
              show --target-sha "${DEPLOY_SHA}")"
          fi
          if [[ "${journal_phase}" == "FINAL_BACKUP_STARTED" ]]; then
            assert_unit_inactive "${service_name}"
            if [[ -z "${journal_state}" ]]; then
              journal_state="$("${app_dir}/venv/bin/python" -I "${deploy_journal}" \
                show --target-sha "${DEPLOY_SHA}")"
            fi
            identity_json="$(database_identity)"
            database_name="$(printf '%s' "${identity_json}" | journal_field database_name)"
            database_system_identifier="$(printf '%s' "${identity_json}" | journal_field database_system_identifier)"
            database_size="$(printf '%s' "${identity_json}" | journal_field database_size)"
            "${app_dir}/venv/bin/python" -I \
              "${candidate_stage}/tools/check_backup_capacity.py" \
              --path "${backup_dir}" --payload-bytes "${database_size}" \
              --reserve-bytes "${minimum_free_reserve_bytes}" \
              --purpose "the offline backup plus the 1 GiB safety reserve"
            echo "Creating the final verified backup with API writes stopped..."
            umask 077
            planned_backup_name="$(printf '%s' "${journal_state}" | journal_field backup_name)"
            database_backup="${backup_dir}/${planned_backup_name}"
            if [[ -e "${database_backup}" || -L "${database_backup}" ]]; then
              if [[ -L "${database_backup}" || ! -f "${database_backup}" || \
                    "$(stat -c '%u:%g:%a:%h' "${database_backup}")" != "$(id -u):$(id -g):600:1" ]]; then
                echo "Refusing to remove an unsafe unbound final backup path." >&2
                exit 1
              fi
              echo "Removing the exact unbound final backup from an interrupted retry."
              rm -- "${database_backup}"
            fi
            backup_result="$(
              cd "${candidate_stage}"
              AUTO_INIT_ON_STARTUP=false ENABLE_BACKGROUND_TASKS=false \
                "${app_dir}/venv/bin/python" -m app.scripts.create_verified_database_backup \
                  --output "${database_backup}" \
                  --expected-database prod_unikorn
            )"
            backup_size="$(printf '%s' "${backup_result}" | journal_field size)"
            backup_sha256="$(printf '%s' "${backup_result}" | journal_field sha256)"
            backup_device="$(printf '%s' "${backup_result}" | journal_field device)"
            backup_inode="$(printf '%s' "${backup_result}" | journal_field inode)"
            backup_mtime_ns="$(printf '%s' "${backup_result}" | journal_field mtime_ns)"
            "${app_dir}/venv/bin/python" -I \
              "${candidate_stage}/tools/check_backup_capacity.py" \
              --path "${backup_dir}" --payload-bytes 0 \
              --reserve-bytes "${minimum_free_reserve_bytes}" \
              --purpose "the post-backup 1 GiB safety reserve"
            journal_advance FINAL_BACKUP_VERIFIED \
              --backup-path "${database_backup}" \
              --backup-size "${backup_size}" \
              --backup-sha256 "${backup_sha256}" \
              --backup-device "${backup_device}" \
              --backup-inode "${backup_inode}" \
              --backup-mtime-ns "${backup_mtime_ns}" \
              --database-name "${database_name}" \
              --database-system-identifier "${database_system_identifier}"
            journal_phase="FINAL_BACKUP_VERIFIED"
            umask 022
          fi

          rm -rf -- "${candidate_stage}"
          candidate_stage=""

          case "${journal_phase}" in
            FINAL_BACKUP_VERIFIED|CHECKOUT_ACTIVATION_REQUESTED|CANDIDATE_CHECKED_OUT|MIGRATION_STARTED)
              journal_state="$("${app_dir}/venv/bin/python" -I "${deploy_journal}" \
                show --target-sha "${DEPLOY_SHA}")"
              "${app_dir}/venv/bin/python" -I "${deploy_journal}" \
                verify-backup --target-sha "${DEPLOY_SHA}" >/dev/null
              assert_recorded_database_identity
              ;;
          esac

          if [[ "${journal_phase}" == "FINAL_BACKUP_VERIFIED" ]]; then
            journal_advance CHECKOUT_ACTIVATION_REQUESTED
            journal_phase="CHECKOUT_ACTIVATION_REQUESTED"
          fi
          if [[ "${journal_phase}" == "CHECKOUT_ACTIVATION_REQUESTED" ]]; then
            if [[ "$(git rev-parse HEAD)" != "${DEPLOY_SHA}" ]]; then
              git checkout --detach "${DEPLOY_SHA}"
            fi
            test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            journal_advance CANDIDATE_CHECKED_OUT
            journal_phase="CANDIDATE_CHECKED_OUT"
          fi
          if [[ "${journal_phase}" == "CANDIDATE_CHECKED_OUT" ]]; then
            journal_state="$("${app_dir}/venv/bin/python" -I "${deploy_journal}" \
              show --target-sha "${DEPLOY_SHA}")"
            "${app_dir}/venv/bin/python" -I "${deploy_journal}" \
              verify-backup --target-sha "${DEPLOY_SHA}" >/dev/null
            assert_recorded_database_identity
            journal_advance MIGRATION_STARTED
            journal_phase="MIGRATION_STARTED"
          fi
          if [[ "${journal_phase}" == "MIGRATION_STARTED" ]]; then
            api_forward_only=true
            test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            journal_state="$("${app_dir}/venv/bin/python" -I "${deploy_journal}" \
              show --target-sha "${DEPLOY_SHA}")"
            "${app_dir}/venv/bin/python" -I "${deploy_journal}" \
              verify-backup --target-sha "${DEPLOY_SHA}" >/dev/null
            assert_recorded_database_identity
            AUTO_INIT_ON_STARTUP=false ENABLE_BACKGROUND_TASKS=false \
              "${app_dir}/venv/bin/python" -m flask db upgrade heads
            live_heads="$(
              AUTO_INIT_ON_STARTUP=false ENABLE_BACKGROUND_TASKS=false \
                "${app_dir}/venv/bin/python" -m flask db current 2>/dev/null |
                awk '{print $1}' | sort -u
            )"
            if [[ "${live_heads}" != "${expected_candidate_heads}" ]]; then
              echo "Database did not reach the exact candidate Alembic heads:" >&2
              printf '%s\n' "${live_heads}" >&2
              exit 1
            fi
            journal_advance DB_AT_TARGET
            journal_phase="DB_AT_TARGET"
          elif [[ "${journal_phase}" != "PREPARED" && \
                  "${journal_phase}" != "SERVICE_STOP_REQUESTED" && "${journal_phase}" != "SERVICE_STOPPED" && \
                  "${journal_phase}" != "FINAL_BACKUP_STARTED" && "${journal_phase}" != "FINAL_BACKUP_VERIFIED" && \
                  "${journal_phase}" != "CHECKOUT_ACTIVATION_REQUESTED" && "${journal_phase}" != "CANDIDATE_CHECKED_OUT" ]]; then
            api_forward_only=true
          fi

          if [[ "${journal_phase}" == "DB_AT_TARGET" ]]; then
            journal_advance CANDIDATE_START_REQUESTED
            journal_phase="CANDIDATE_START_REQUESTED"
          fi
          if [[ "${journal_phase}" == "CANDIDATE_START_REQUESTED" ]]; then
            test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            /usr/bin/systemctl is-active --quiet "${service_name}" || \
              sudo -n /usr/bin/systemctl start "${service_name}"
            /usr/bin/systemctl is-active --quiet "${service_name}"
            journal_advance CANDIDATE_STARTED
            journal_phase="CANDIDATE_STARTED"
          fi

          case "${journal_phase}" in
            CANDIDATE_STARTED|HEALTHY|COMMITTED)
              test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"
              test -z "$(git status --porcelain=v1 --untracked-files=all)"
              /usr/bin/systemctl is-active --quiet "${service_name}" || \
                sudo -n /usr/bin/systemctl start "${service_name}"
              assert_api_service_checkout

              api_response="$(mktemp)"
              api_ready=false
              for attempt in {1..12}; do
                if curl --fail --silent --show-error \
                  --connect-timeout 2 --max-time 5 \
                  --output "${api_response}" "${local_api_url}"; then
                  api_ready=true
                  break
                fi
                echo "Local API is not ready yet (attempt ${attempt}/12)."
                sleep 3
              done
              if [[ "${api_ready}" != "true" ]]; then
                echo "Local production API did not become ready." >&2
                sudo -n /usr/bin/journalctl -u "${service_name}" -n 100 --no-pager || true
                exit 1
              fi
              "${app_dir}/venv/bin/python" - "${api_response}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              payload = json.load(response_file)
          if not isinstance(payload, list) or not payload:
              raise SystemExit("scheduler semester API returned no semesters")
          required = {"id", "name", "section_count"}
          if any(
              not isinstance(row, dict) or not required <= row.keys()
              for row in payload
          ):
              raise SystemExit("scheduler semester API returned an unexpected schema")
          if not any(
              isinstance(row["section_count"], int) and row["section_count"] > 0
              for row in payload
          ):
              raise SystemExit("scheduler semester API returned no populated semester")
          print(f"Local scheduler API verified with {len(payload)} semester(s).")
          PY
              rm -f -- "${api_response}"
              api_response=""

              public_api_response="$(mktemp)"
              if ! curl --fail --silent --show-error \
                --connect-timeout 5 --max-time 15 \
                --output "${public_api_response}" "${public_api_url}"; then
                echo "Public production API did not pass the candidate health check." >&2
                exit 1
              fi
              "${app_dir}/venv/bin/python" - "${public_api_response}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              payload = json.load(response_file)
          if not isinstance(payload, list) or not payload:
              raise SystemExit("public scheduler semester API returned no semesters")
          PY
              rm -f -- "${public_api_response}"
              public_api_response=""
              ;;
            *)
              echo "Unexpected API deployment journal phase: ${journal_phase}" >&2
              exit 1
              ;;
          esac

          if [[ "${journal_phase}" == "CANDIDATE_STARTED" ]]; then
            journal_advance HEALTHY
            journal_phase="HEALTHY"
          fi
          if [[ "${journal_phase}" == "HEALTHY" ]]; then
            git checkout -B production "${DEPLOY_SHA}"
            test "$(git symbolic-ref --short HEAD)" = "production"
            test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            journal_advance COMMITTED
            journal_phase="COMMITTED"
          fi
          test "${journal_phase}" = "COMMITTED"
          api_transaction_committed=true
          deployed_sha="$(git rev-parse HEAD)"
          echo "Production API transaction committed at ${deployed_sha}."

          if [[ "${skip_sampler_activation}" == "true" ]]; then
            echo "Incomplete API transaction recovered during the protected window; sampler activation intentionally skipped."
            deployment_succeeded=true
            exit 0
          fi

          {
            command -v crontab >/dev/null
            # Recheck after the API commit to close the deployment-time race.
            assert_legacy_sampler_units_absent
            echo "Building an immutable popularity sampler release..."
            install -d -m 0755 "${sampler_root}"
            if [[ -d "${sampler_candidate}" ]]; then
              test "$(<"${sampler_candidate}/.unikorn-commit")" = "${DEPLOY_SHA}"
              test -f "${sampler_candidate}/scripts/run_scheduler_popularity_cron.py"
              test -f "${sampler_candidate}/scripts/sample_scheduler_popularity.py"
              test -f "${sampler_candidate}/tools/render_scheduler_popularity_crontab.py"
              test -L "${sampler_candidate}/venv"
              test "$(readlink "${sampler_candidate}/venv")" = "${app_dir}/venv"
              test ! -w "${sampler_candidate}/scripts/run_scheduler_popularity_cron.py"
            else
              sampler_release_stage="$(mktemp -d "${sampler_root}/.${DEPLOY_SHA}.XXXXXX")"
              extract_sampler_release "${sampler_release_stage}"
              ln -s "${app_dir}/venv" "${sampler_release_stage}/venv"
              printf '%s\n' "${DEPLOY_SHA}" > "${sampler_release_stage}/.unikorn-commit"
              chmod -R a-w,a+rX "${sampler_release_stage}"
              mv -- "${sampler_release_stage}" "${sampler_candidate}"
              sampler_release_stage=""
            fi
            "${sampler_candidate}/venv/bin/python" -I -c 'import flask, sqlalchemy'
            sampler_verify_stage="$(mktemp -d /tmp/unikorn-popularity-release-verify.XXXXXX)"
            extract_sampler_release "${sampler_verify_stage}"
            find "${sampler_candidate}" -type l -print | \
              grep -Fxq "${sampler_candidate}/venv"
            test "$(find "${sampler_candidate}" -type l -print | wc -l)" -eq 1
            if ! diff -qr --no-dereference \
                --exclude=venv --exclude=.unikorn-commit \
                "${sampler_verify_stage}" "${sampler_candidate}"; then
              echo "Immutable sampler release differs from the candidate commit." >&2
              exit 1
            fi
            rm -rf -- "${sampler_verify_stage}"
            sampler_verify_stage=""
            echo "Immutable sampler release ready at ${sampler_candidate}."

            # The SSH deployment identity is exactly the future cron identity.
            # Prove that it can read only the fixed root:www-data environment.
            effective_uid="$(id -u)"
            www_data_gid="$(getent group www-data | cut -d: -f3)"
            test "${www_data_gid}" = "33"
            IFS=: read -r env_uid env_gid env_mode < <(stat -c '%u:%g:%a' "${sampler_env_file}")
            test "${env_uid}:${env_gid}:${env_mode}" = "0:33:640"
            id -G | tr ' ' '\n' | grep -Fxq "${www_data_gid}"
            test -r "${sampler_env_file}"
            test "$(timedatectl show -p Timezone --value)" = "Asia/Shanghai"

            sampler_state_dir="${HOME}/.local/state/unikorn/scheduler-popularity-2610"
            install -d -m 0700 "${sampler_state_dir}"
            test "$(stat -c '%u:%a' "${sampler_state_dir}")" = "${effective_uid}:700"
            sampler_runner="${sampler_candidate}/scripts/run_scheduler_popularity_cron.py"
            sampler_args=(
              "${sampler_candidate}/venv/bin/python" -I "${sampler_runner}"
              --expected-sha "${DEPLOY_SHA}"
              --env-file "${sampler_env_file}"
              --lock-file "${sampler_lock_file}"
              --state-dir "${sampler_state_dir}"
            )
            export UNIKORN_BACKEND_MUTATION_LOCK_FD=9
            export UNIKORN_BACKEND_MUTATION_LOCK_DEV_INO="$(stat -Lc '%d:%i' "/proc/$$/fd/9")"
            status_output="$("${sampler_args[@]}" --mode status)"
            sampling_state="$(printf '%s' "${status_output}" | \
              "${sampler_candidate}/venv/bin/python" -c \
              'import json,sys; print(json.load(sys.stdin)["sampler_result"]["sampling_state"])')"
            if [[ "${sampling_state}" == "not_started" ]]; then
              echo "Taking the one permitted deployment baseline before cron activation."
              baseline_output="$("${sampler_args[@]}" --mode baseline)"
              baseline_status="$(printf '%s' "${baseline_output}" | \
                "${sampler_candidate}/venv/bin/python" -c \
                'import json,sys; print(json.load(sys.stdin)["sampler_result"]["status"])')"
              test "${baseline_status}" = "completed"
            elif [[ "${sampling_state}" == "fresh" ]]; then
              "${sampler_args[@]}" --mode verify-freshness >/dev/null
            elif [[ "${sampling_state}" == "ended_complete" ]]; then
              "${sampler_args[@]}" --mode verify-terminal >/dev/null
            else
              echo "Refusing sampler activation from database state ${sampling_state}; never re-baselining existing history." >&2
              exit 1
            fi

            crontab_stage="$(mktemp -d /tmp/unikorn-popularity-crontab.XXXXXX)"
            crontab_before="${crontab_stage}/before"
            crontab_candidate="${crontab_stage}/candidate"
            crontab_readback="${crontab_stage}/readback"
            sampler_block="${crontab_stage}/managed-block"
            if crontab -l > "${crontab_before}" 2>"${crontab_stage}/read-error"; then
              crontab_existed=true
            else
              crontab_read_status=$?
              if [[ "${crontab_read_status}" -eq 1 ]] && \
                  grep -Fq 'no crontab for' "${crontab_stage}/read-error"; then
                : > "${crontab_before}"
              else
                echo "Unable to read the deployment user's existing crontab." >&2
                exit 1
              fi
            fi
            original_crontab_sha="$(sha256sum "${crontab_before}" | cut -d ' ' -f1)"
            if (( deploy_epoch < terminal_cutoff_epoch )); then
              {
                echo '# BEGIN UNIKORN SCHEDULER POPULARITY 2610 (MANAGED)'
                if (( deploy_epoch < sample_end_epoch )); then
                  printf '*/5 * 1-31 8,9 * %q -I %q --mode regular --expected-sha %q --env-file %q --lock-file %q --state-dir %q\n' \
                    "${sampler_candidate}/venv/bin/python" "${sampler_runner}" "${DEPLOY_SHA}" \
                    "${sampler_env_file}" "${sampler_lock_file}" "${sampler_state_dir}"
                fi
                printf '59 23 30 9 * %q -I %q --mode terminal --expected-sha %q --env-file %q --lock-file %q --state-dir %q\n' \
                  "${sampler_candidate}/venv/bin/python" "${sampler_runner}" "${DEPLOY_SHA}" \
                  "${sampler_env_file}" "${sampler_lock_file}" "${sampler_state_dir}"
                echo '# END UNIKORN SCHEDULER POPULARITY 2610 (MANAGED)'
              } > "${sampler_block}"
              "${sampler_candidate}/venv/bin/python" -I \
                "${sampler_candidate}/tools/render_scheduler_popularity_crontab.py" \
                --existing "${crontab_before}" --replacement "${sampler_block}" \
                --output "${crontab_candidate}"
            else
              "${sampler_candidate}/venv/bin/python" -I \
                "${sampler_candidate}/tools/render_scheduler_popularity_crontab.py" \
                --existing "${crontab_before}" --remove --output "${crontab_candidate}"
            fi
            expected_crontab_sha="$(sha256sum "${crontab_candidate}" | cut -d ' ' -f1)"
            if crontab -l > "${crontab_before}.verify" 2>"${crontab_stage}/verify-error"; then
              test "${crontab_existed}" = "true"
            else
              crontab_verify_status=$?
              if [[ "${crontab_verify_status}" -eq 1 ]] && \
                  grep -Fq 'no crontab for' "${crontab_stage}/verify-error"; then
                test "${crontab_existed}" = "false"
                : > "${crontab_before}.verify"
              else
                echo "Unable to re-read the user crontab immediately before activation." >&2
                exit 1
              fi
            fi
            cmp -s "${crontab_before}" "${crontab_before}.verify"
            installed_crontab_sha="${expected_crontab_sha}"
            activate_sampling_crontab
            unset UNIKORN_BACKEND_MUTATION_LOCK_FD UNIKORN_BACKEND_MUTATION_LOCK_DEV_INO
            echo "Scheduler popularity user crontab activated and byte-for-byte verified."
          }
          deployment_succeeded=true
          [[ -z "${crontab_stage}" ]] || rm -rf -- "${crontab_stage}"
          crontab_stage=""

          echo "Production deployment completed at ${deployed_sha}."

    - name: Verify the public production API
      env:
        CONFIGURED_PROD_API_URL: ${{ vars.PROD_SCHEDULER_HEALTH_URL }}
      run: |
        set -euo pipefail
        api_url="${CONFIGURED_PROD_API_URL:-https://unikorn.axfff.com/api/scheduler/semesters}"
        api_response="$(mktemp)"
        trap 'rm -f "${api_response}"' EXIT

        api_ready=false
        for attempt in {1..12}; do
          if curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --output "${api_response}" "${api_url}"; then
            api_ready=true
            break
          fi
          echo "Public API is not ready yet (attempt ${attempt}/12)."
          sleep 5
        done
        if [[ "${api_ready}" != "true" ]]; then
          echo "Public production API did not become ready at ${api_url}." >&2
          exit 1
        fi

        python3 - "${api_response}" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as response_file:
            payload = json.load(response_file)
        if not isinstance(payload, list) or not payload:
            raise SystemExit("public scheduler semester API returned no semesters")
        required = {"id", "name", "section_count"}
        if any(not isinstance(row, dict) or not required <= row.keys() for row in payload):
            raise SystemExit("public scheduler semester API returned an unexpected schema")
        if not any(isinstance(row["section_count"], int) and row["section_count"] > 0 for row in payload):
            raise SystemExit("public scheduler semester API returned no populated semester")
        print(f"Public scheduler API verified with {len(payload)} semester(s).")
        PY

        {
          echo "### Production deployment verified"
          echo "- Commit: \`${GITHUB_SHA}\`"
          echo "- Public API: ${api_url}"
        } >> "${GITHUB_STEP_SUMMARY}"
