name: Deploy to Dev Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-mutations-dev
  cancel-in-progress: false

jobs:
  test:
    name: Test dev candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the main branch
        run: |
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies and run backend tests
        run: |
          set -Eeuo pipefail
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
          python - <<'PY'
          from alibabacloud_green20220302.client import Client  # noqa: F401
          from alibabacloud_tea_openapi import models  # noqa: F401
          PY
          python -m pytest tests/ -q

  deploy:
    name: Deploy verified dev candidate
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Deploy exact commit via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 35m
          script: |
            set -Eeuo pipefail

            readonly app_dir="/data/dev_unikorn/back-end"
            readonly backup_dir="/data/dev_unikorn/backups"
            readonly service_name="dev-unikorn-api.service"
            readonly local_api_url="http://127.0.0.1:8000/scheduler/semesters"

            cd "$app_dir"
            umask 077
            exec 9>/data/dev_unikorn/backend-mutations-dev.lock
            flock -n 9
            dirty_state="$(git status --porcelain=v1 --untracked-files=all)"
            if [[ -n "$dirty_state" ]]; then
              echo "Refusing to deploy over a dirty dev checkout:" >&2
              printf '%s\n' "$dirty_state" >&2
              exit 1
            fi

            git fetch --prune origin \
              "+refs/heads/main:refs/remotes/origin/main"
            remote_sha="$(git rev-parse refs/remotes/origin/main)"
            test "$remote_sha" = "$DEPLOY_SHA"
            git checkout main
            git merge --ff-only "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"

            python3 tools/normalize_runtime_permissions.py \
              --repository "$app_dir"

            umask 022
            source venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt --timeout 600
            python -m pip install --force-reinstall --no-deps \
              'PyJWT>=2.13,<3' --timeout 600
            python -m pip check
            python - <<'PY'
            from alibabacloud_green20220302.client import Client  # noqa: F401
            from alibabacloud_tea_openapi import models  # noqa: F401
            from flask_jwt_extended import JWTManager  # noqa: F401
            from jwt import DecodeError  # noqa: F401
            PY
            find venv -type d -exec chmod go+rx {} +
            find venv -type f -exec chmod go+r {} +
            find venv/bin -type f -exec chmod go+rx {} +
            umask 077

            install -d -m 0750 "$backup_dir"
            timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            short_sha="$(printf '%.12s' "$DEPLOY_SHA")"
            database_backup="${backup_dir}/dev_unikorn-${timestamp}-${short_sha}.dump"
            python -m app.scripts.create_verified_database_backup \
              --output "$database_backup" \
              --expected-database dev_unikorn

            expected_candidate_heads="$(
              AUTO_INIT_ON_STARTUP=false ENABLE_BACKGROUND_TASKS=false \
                python -m flask db heads 2>/dev/null | \
                awk '{print $1}' | sed '/^$/d' | sort -u
            )"
            expected_head_count="$(
              printf '%s\n' "$expected_candidate_heads" | sed '/^$/d' | wc -l
            )"
            if [[ -z "$expected_candidate_heads" || "$expected_head_count" -ne 1 ]]; then
              echo "Expected exactly one candidate Alembic head; got:" >&2
              printf '%s\n' "$expected_candidate_heads" >&2
              exit 1
            fi

            AUTO_INIT_ON_STARTUP=false ENABLE_BACKGROUND_TASKS=false \
              python -m flask db upgrade heads
            live_heads="$(
              AUTO_INIT_ON_STARTUP=false ENABLE_BACKGROUND_TASKS=false \
                python -m flask db current 2>/dev/null | \
                awk '{print $1}' | sed '/^$/d' | sort -u
            )"
            if [[ "${live_heads}" != "${expected_candidate_heads}" ]]; then
              echo "Database did not reach the exact candidate Alembic head:" >&2
              printf 'expected=%s\nactual=%s\n' \
                "$expected_candidate_heads" "$live_heads" >&2
              exit 1
            fi
            printf 'Dev database reached Alembic head %s.\n' "$live_heads"

            python -m app.scripts.init_db

            diagnose_startup_failure() {
              /usr/bin/systemctl status "$service_name" \
                --no-pager --lines=40 || true
              if [ -r /var/unikorn/dev_log/error.log ]; then
                /usr/bin/tail -n 160 /var/unikorn/dev_log/error.log || true
              fi
            }
            trap diagnose_startup_failure ERR

            sudo /usr/bin/systemctl restart "$service_name"
            /usr/bin/systemctl is-active --quiet "$service_name"

            api_response="$(mktemp)"
            trap 'rm -f "$api_response"' EXIT
            api_ready=false
            for attempt in {1..12}; do
              if curl --fail --silent --show-error \
                --connect-timeout 2 --max-time 5 \
                --output "$api_response" "$local_api_url"; then
                api_ready=true
                break
              fi
              echo "Local dev API is not ready yet (attempt ${attempt}/12)."
              sleep 3
            done
            test "$api_ready" = "true"
            trap - ERR
            python - "$api_response" <<'PY'
            import json
            import sys

            with open(sys.argv[1], encoding="utf-8") as response_file:
                payload = json.load(response_file)
            if not isinstance(payload, list) or not payload:
                raise SystemExit("scheduler semester API returned no semesters")
            required = {"id", "name", "section_count"}
            if any(not isinstance(row, dict) or not required <= row.keys() for row in payload):
                raise SystemExit("scheduler semester API returned an unexpected schema")
            PY

      - name: Verify public dev API
        run: |
          set -Eeuo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 20 \
            --output "$response" \
            https://dev.unikorn.axfff.com/api/scheduler/semesters
          python3 - "$response" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              payload = json.load(response_file)
          if not isinstance(payload, list) or not payload:
              raise SystemExit("public dev scheduler API returned no semesters")
          PY
