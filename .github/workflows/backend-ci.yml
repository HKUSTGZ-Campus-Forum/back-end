name: Backend CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
        env:
          POSTGRES_DB: pristine_migrations
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pristine_migrations"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install and test in an isolated environment
        run: |
          set -Eeuo pipefail
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
          python - <<'PY'
          from alibabacloud_green20220302.client import Client  # noqa: F401
          from alibabacloud_tea_openapi import models  # noqa: F401
          PY
          python -m pytest tests/ -q

      - name: Verify migrations on pristine PostgreSQL
        env:
          AUTO_INIT_ON_STARTUP: "false"
          ENABLE_BACKGROUND_TASKS: "false"
          PRISTINE_POSTGRES_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pristine_migrations
        run: |
          set -Eeuo pipefail
          source .venv/bin/activate
          python -m pytest tests/test_pristine_postgres_migrations.py -q -rs

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.3.1
        with:
          version: '0.10.8'
          enable-cache: false

      - name: Verify immutable runtime dependencies
        run: |
          set -Eeuo pipefail
          uv pip compile requirements.txt \
            --constraint requirements.lock \
            --python-version 3.12 \
            --python-platform x86_64-manylinux_2_28 \
            --generate-hashes \
            --no-annotate \
            --custom-compile-command 'uv pip compile requirements.txt --constraint requirements.lock --python-version 3.12 --python-platform x86_64-manylinux_2_28 --generate-hashes --no-annotate --output-file requirements.lock' \
            --output-file /tmp/requirements.lock
          cmp requirements.lock /tmp/requirements.lock

      - name: Build production container
        run: |
          set -Eeuo pipefail
          docker build --platform linux/amd64 --tag "campus-forum-backend:${GITHUB_SHA}" .
          test "$(docker image inspect "campus-forum-backend:${GITHUB_SHA}" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "campus-forum-backend:${GITHUB_SHA}" --format '{{.Config.User}}')" = 10001:10001
          docker run --rm --entrypoint python \
            "campus-forum-backend:${GITHUB_SHA}" \
            -c 'from alibabacloud_green20220302.client import Client; from alibabacloud_tea_openapi import models'
